<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입</title>
  <style>
    * {
      box-sizing: border-box;
    }

  body {
      margin: 0;
      font-family:'Nanum Gothic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px; /* 위쪽 여백 */
    }


    h1 {
      font-weight: 900;
     font-size:30px;
      margin-bottom: 20px;
      color: #000;
      text-decoration: none;
    }

    .form-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 25px;
      width: 320px;
      height:290px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: stretch;
  
    }

    .form-box form,
    .form-box p {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    
    input, button {
      padding: 15px;
      width: 100%;
      margin-bottom: 5px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-wrap {
  width: 100%;
  display: flex;
  justify-content: flex-end; /* 오른쪽 정렬 */
  margin-top: 5px; /* 위 간격 약간 추가 (선택사항) */
}
  .login-wrap a{   
    text-align: center;
    background-color:white;
    color:black;
  }
  </style>
</head>
<body>
  <h1>회원가입</h1>
  <div class="form-box">
    <form id="signupForm">
      <input type="text" id="newUsername" placeholder="아이디" required />
      <input type="password" id="newPassword" placeholder="비밀번호" required />
      <button type="submit">Sign Up</button>
      <p id="signupResult"></p>
    </form>
    <div class="login-wrap">
    <a href="login.html">로그인으로 돌아가기</a>
    </div>
  </div>

  <script>
  document.getElementById("signupForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const username = document.getElementById("newUsername").value;
    const password = document.getElementById("newPassword").value;
    const resultEl = document.getElementById("signupResult");

    fetch("https://test1-zcyn.onrender.com/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    })
    .then(response => {
      if (!response.ok) return response.json().then(data => { throw new Error(data.message); });
      return response.json();
    })
    .then(data => {
      resultEl.innerText = data.message;
      resultEl.style.color = "green";
    })
    .catch(error => {
      resultEl.innerText = error.message;
      resultEl.style.color = "red";
    });
  });
</script>

</body>
</html>
