<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현석 로그인</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:'Nanum Gothic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px; /* 위쪽 여백 */
    }

    #home {
      font-weight: 900;
     font-size:30px;
      margin-bottom: 20px;
      color: #000;
      text-decoration: none;
    }
  

    .form-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 25px;
      width: 320px;
      height:300px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .form-box form,
    .form-box a,
    .form-box p {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .signup-wrap{
      width: 100%;
      display: flex;
      flex-direction:row;
      align-items: center;
    }
    #signup{
      
      color:black;
      height:10px;
    }
    input, button {
      padding: 15px;
      width: 100%;
      margin-bottom: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

 

    @media (max-width: 768px) {
      .form-box {
        width: 100%;
        max-width: 300px;
        padding: 20px;
      }

 
    }
  </style>
</head>
<body>
  <a id="home" href="index.html">HYUN SEOK</a>
  <div class="form-box">
    <form id="loginForm">
      <input type="text" id="username" placeholder="아이디" required />
      <input type="password" id="password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
      <p id="result"></p>
    </form>
    <div class="signup-wrap">
    <p>계정이 없으신가요?</p>
    
      <a id="signup" href="signup.html">회원가입</a>
    </div>    
  </div>

 <script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    fetch("https://test1-zcyn.onrender.com/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    })
    .then(res => {
      if (!res.ok) {
        throw new Error("로그인 실패");
      }
      return res.json();
    })
    .then(data => {
      const resultTag = document.getElementById("result");
      resultTag.innerText = data.message;
      resultTag.style.color = "green";
      // 로그인 성공 시 원하는 페이지로 이동
      window.location.href = "https://finance.naver.com/item/main.nhn?code=005930";
    })
    .catch(err => {
      const resultTag = document.getElementById("result");
      resultTag.innerText = "아이디 또는 비밀번호가 틀렸습니다.";
      resultTag.style.color = "red";
    });
  });
</script>

</body>
</html>
