<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현석's website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Nanum Gothic', sans-serif;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color:white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px; /* 위쪽 여백 */
    }

    #home {
      text-decoration: none;
      text-align: center;
      font-weight:900;
      border-radius: 15px;
      margin-bottom: 20px;
      color: #000;
      font-size: 50px;
    }

    .form-box {
      background-color:white;
            padding: 18px;
      width: 280px;
      height: 120px; /* ✅ 추가: 높이 늘리기 */
      border: 1px solid gray;
      border-radius: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* ✅ 추가: 위/아래 요소 간격 자동 조절 */
      position: absolute;
      right: 50px;
      top: 50px;
    }

    .form-box form,
    .form-box a,
    .form-box p {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .signup-wrap{
      height:5px;
      align-self: flex-end; /* ✅ 수정: 오른쪽 정렬 */
    }


    #로그인 {
      text-decoration: none;
      color: black;
      border: 2px solid gray;
      padding: 10px;
      background-color:rgb(204, 201, 201);
      border-radius: 3px;
      font-size: 25px;
    }

    #회원가입 {
      margin-top: auto;      /* ✅ 추가: 아래로 내리기 */
      margin-right: 5px;     /* ✅ 추가: 오른쪽 약간 띄우기 */
      font-size: 14px;       /* ✅ 추가: 글자 크기 조정 */
      color: rgb(11, 9, 11);         /* ✅ 추가: 색상 변경 */
    }

  </style>
</head>
<body>
  <a id="home" href="index.html">HYUN SEOK</a>
  <div class="form-box">
    <a id="로그인" href="login.html">로그인</a>
    <div class="signup-wrap">
    <a id="회원가입" href="signup.html">회원가입</a>
    </div>    
  </div>
</body>
</html>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const found = users.find(u => u.username === user && u.password === pass);

      const resultTag = document.getElementById("result");
      if (found) {
        resultTag.innerText = "로그인 성공!";
        resultTag.style.color = "green";
        localStorage.setItem("currentUser", user);
        window.location.href = "https://finance.naver.com/item/main.nhn?code=005930";
      } else {
        resultTag.innerText = "아이디 또는 비밀번호가 틀렸습니다.";
        resultTag.style.color = "red";
      }
    });
  </script>
</body>
</html>
